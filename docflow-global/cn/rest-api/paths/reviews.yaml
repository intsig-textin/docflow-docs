      关键返回结果字段：fileBatchNo
    operationId: listExecuteTasksByFileBatchNo
    parameters:
      - name: workspaceIdNo
        in: query
        required: true
        schema:
          type: string
          description: 工作空间ID
          example: 123
      - name: fileBatchNo
        in: query
        required: true
        schema:
          type: string
          description: 文件批次号
          example: abcd
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultListApiFileBatchExecuteTaskRespVO'
