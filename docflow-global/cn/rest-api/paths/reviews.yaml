/api/app-api/sip/platform/v2/review/listByFileBatchNo:
  get:
    tags:
      - 文件审核
    summary: 文件批次列表
    description: 文件批次列表，请求参数workspaceIdNo从页面获取
    operationId: listByFileBatchNo
    parameters:
      - name: workspaceIdNo
        in: query
        required: true
        schema:
          type: string
          description: 工作空间唯一编号
          example: 123456
      - name: fileBatchNo
        in: query
        required: false
        schema:
          type: string
          description: 文件批次号
          example: abcd
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultListApiFileBatchInfoRespVO'
/api/app-api/sip/platform/v2/review/listExecuteTasksByFileBatchNo:
  get:
    tags:
