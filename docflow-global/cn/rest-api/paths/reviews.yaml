/api/app-api/sip/platform/v2/review/listModelFieldInfoByClassificationIdNoList:
  post:
    tags:
      - 文件审核
    summary: 模型字段列表
    description: >-
      模型字段列表，请求参数需从前置接口获取。


      >
      前置接口：/api/app-api/sip/platform/v2/review/listExecuteTasksByFileBatchNo

      作用：用于创建规则时的前置接口，获取批次下的所有分类id，可以从返回结果中选择需要用于创建规则的分类

      关键返回结果字段：taskClassificationIdNo（分类id）


      > 前置接口：/api/app-api/sip/platform/v2/review/getRulesByClassificationIdNo

      作用：用于修改规则时的前置接口，获取规则的分类id信息

      关键返回结果字段：classificationIdNoList（当前规则配置的分类id列表）
    operationId: listModelFieldInfoByClassificationIdNoList
    parameters:
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/reviews.yaml#/ApiClassificationIdNoListReqVO'
      required: true
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultListApiModelFieldRespVO'
/api/app-api/sip/platform/v2/review/create:
  post:
    tags:
      - 文件审核
    summary: 创建审核规则
    description: >-
      创建审核规则，调用接口前需要调用一些前置接口。


      >
      前置接口：/api/app-api/sip/platform/v2/review/listExecuteTasksByFileBatchNo

      作用：获取批次下的所有分类id

      关键返回结果字段：taskClassificationIdNo（分类id）


      >
      前置接口：/api/app-api/sip/platform/v2/review/listModelFieldInfoByClassificationIdNoList

      作用：获取分类下的字段信息

      关键返回结果字段：id（含义同fieldId）、fieldName、blockType（区分是普通字段还是表格字段）、classificationIdNo（区分字段属于哪个分类）、
      tableIdNo（表格id，如果字段是表格字段）、tableName（表格名称，如果字段是表格字段）
    operationId: createReviewRule
    parameters:
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/reviews.yaml#/ApiRuleReviewCreateReqVO'
      required: true
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultApiRuleReviewCreateRespVO'
/api/app-api/sip/platform/v2/review/update:
  post:
    tags:
      - 文件审核
    summary: 更新审核规则
    description: >-
      更新审核规则，调用接口前需要调用一些前置接口。


      >
      前置接口：/api/app-api/sip/platform/v2/review/listModelFieldInfoByClassificationIdNoList

      作用：获取分类下的字段信息

      关键返回结果字段：id（含义同fieldId）、fieldName、blockType（区分是普通字段还是表格字段）、classificationIdNo（区分字段属于哪个分类）、
      tableIdNo（表格id，如果字段是表格字段）、tableName（表格名称，如果字段是表格字段）


      > 前置接口：/api/app-api/sip/platform/v2/review/getRulesByClassificationIdNo

      作用：根据workspaceIdNo和fileBatchNo获取当前批次的所有审核规则

      关键返回结果字段：classificationIdNoList（当前规则配置的分类id列表）、fieldInfoList（当前规则配置的字段信息列表）、reviewRuleIdNo（审核规则id）
    operationId: updateReviewRule
    parameters:
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/reviews.yaml#/ApiRuleReviewUpdateReqVO'
      required: true
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultApiRuleReviewUpdateRespVO'
