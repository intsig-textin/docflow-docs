/api/app-api/sip/platform/v2/category/fields/add:
  post:
    summary: 新增文件类别字段
    description: 在指定文件类别下新增一个字段，支持新增普通字段和表格字段
    operationId: addCategoryField
    tags:
      - 文件类别
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: '../components/schemas/categories.yaml#/CategoryFieldConfig'
            - type: object
              properties:
                workspace_id:
                  type: string
                  description: 空间ID
                  example: '1234567890'
                category_id:
                  type: string
                  description: 文件类别ID
                  example: '1234567890'
                table_id:
                  type: string
                  description: |
                    表格ID
                    - 不传或为空：创建普通字段，结果会出现在 result.fields 中
                    - 传入表格ID：创建对应表格下的表格字段，结果会出现在 result.tables[].fields 中
                  example: '1234567890'
                extract_model:
                  type: string
                  description: |
                    选填，字段级抽取模型，仅普通字段（非表格字段）支持，不填默认 Model 1
                    - Model 1: 速度快，抽取结果稳定
                    - Model 2: 适用复杂文档理解
                    - Model 3: 多模态，适用简单抽取
                  example: Model 1
                  enum:
                    - Model 1
                    - Model 2
                    - Model 3
              required:
                - workspace_id
                - category_id
                - name
    responses:
      '200':
        description: 成功新增文件类别字段
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
              - type: object
                properties:
                  result:
                    type: object
                    properties:
                      field_id:
                        type: string
                        description: 新创建的字段ID
                        example: '1234567890'
/api/app-api/sip/platform/v2/category/fields/update:
  post:
    summary: 更新文件类别字段
    description: 更新指定文件类别字段的信息，支持普通字段和表格字段
    operationId: updateCategoryField
    tags:
      - 文件类别
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
            - $ref: '../components/schemas/categories.yaml#/CategoryFieldConfig'
            - type: object
              properties:
                workspace_id:
                  type: string
                  description: 空间ID
                  example: '1234567890'
                category_id:
                  type: string
                  description: 文件类别ID
                  example: '1234567890'
                field_id:
                  type: string
                  description: 字段ID
                  example: '1234567890'
                table_id:
                  type: string
                  description: |
                    表格ID
                    - 对普通字段可不传
                    - 对表格字段需要传入其所属的表格ID
                  example: '1234567890'
                extract_model:
                  type: string
                  description: |
                    字段级抽取模型
                    - Model 1: 速度快，抽取结果稳定
                    - Model 2: 适用复杂文档理解
                    - Model 3: 多模态，适用简单抽取
                  example: Model 1
                  enum:
                    - Model 1
                    - Model 2
                    - Model 3
              required:
                - workspace_id
                - category_id
                - field_id
    responses:
      '200':
        description: 成功更新文件类别字段
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
/api/app-api/sip/platform/v2/category/fields/delete:
  post:
    summary: 删除文件类别字段
    description: 删除指定的文件类别字段，支持批量删除普通字段和表格字段
    operationId: deleteCategoryFields
    tags:
      - 文件类别
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                type: string
                description: 空间ID
                example: '1234567890'
              category_id:
                type: string
                description: 文件类别ID
                example: '1234567890'
              field_ids:
                type: array
                description: 要删除的字段ID列表
                items:
                  type: string
                example:
                  - '1234567890'
                  - '0987654321'
              table_id:
                type: string
                description: |
                  表格ID
                  - 不传：删除普通字段（result.fields 中的字段）
                  - 传入表格ID：删除对应表格下的表格字段（result.tables[].fields 中的字段）
                example: '1234567890'
            required:
              - workspace_id
              - category_id
              - field_ids
    responses:
      '200':
        description: 成功删除文件类别字段
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
/api/app-api/sip/platform/v2/category/tables/list:
