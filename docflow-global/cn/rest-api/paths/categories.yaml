/api/app-api/sip/platform/v2/category/create:
  post:
    summary: 创建文件类别
    description: 创建文件类别
    operationId: createCategory
    tags:
      - 文件类别
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                $ref: '../components/schemas/workspaces.yaml#/WorkspaceId'
              name:
                type: string
                description: 文件类别名称
                example: 发票
              description:
                type: string
                description: 文件类别描述
                example: 发票分类描述
            required:
              - name
    responses:
      '200':
        description: 成功创建文件类别
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
              - type: object
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                        description: 文件类别ID
                        example: "1234567890"
/api/app-api/sip/platform/v2/category/list:
  get:
    summary: 获取文件类别列表
    description: 获取文件类别列表
    operationId: listCategories
    tags:
      - 文件类别
    parameters:
      - name: page
        in: query
        description: 页码，默认1
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: 每页数量，默认1000
        required: false
        schema:
          type: integer
          default: 1000
      - name: workspace_id
        in: query
        description: 工作空间ID
        required: true
        schema:
          $ref: '../components/schemas/workspaces.yaml#/WorkspaceId'
      - name: enabled
        in: query
        description: "启用状态 0: 禁用 1: 启用 2: 草稿"
        required: false
        schema:
          type: string
          default: "1"
          enum:
            - "all"
            - "1"
            - "0"
            - "2"
    responses:
      '200':
        description: 成功获取文件类别列表
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
              - type: object
                properties:
                  result:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 文件类别总数
                        example: 100
                      page:
                        type: integer
                        description: 当前页码
                        example: 1
                      page_size:
                        type: integer
                        description: 每页数量
                        example: 20
                      categories:
                        type: array
                        items:
                          $ref: '../components/schemas/categories.yaml#/CategoryListItem'
