                  - Model 2: 适用复杂文档理解
                  - Model 3: 多模态，适用简单抽取
                example: Model 1
                enum:
                  - Model 1
                  - Model 2
                  - Model 3
            required:
              - workspace_id
              - category_id
              - name
    responses:
      '200':
        description: 成功新增文件类别表格
