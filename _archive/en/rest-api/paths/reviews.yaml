/api/app-api/sip/platform/v2/review/listByFileBatchNo:
  get:
    tags:
      - File Review
    summary: File Batch List
    description: File batch list. The request parameter workspaceIdNo is obtained from the page.
    operationId: listByFileBatchNo
    parameters:
      - name: workspaceIdNo
        in: query
        required: true
        schema:
          type: string
          description: Workspace ID
          example: 123456
      - name: fileBatchNo
        in: query
        required: false
        schema:
          type: string
          description: File Batch Number
          example: abcd
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultListApiFileBatchInfoRespVO'
