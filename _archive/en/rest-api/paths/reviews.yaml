/api/app-api/sip/platform/v2/review/listModelFieldInfoByClassificationIdNoList:
  post:
    tags:
      - File Review
    summary: Model Field List
    description: >-
      Model field list. Request parameters need to be obtained from prerequisite APIs.


      >
      Prerequisite API: /api/app-api/sip/platform/v2/review/listExecuteTasksByFileBatchNo

      Purpose: Used as a prerequisite when creating rules to get all classification IDs under the batch. You can select the classifications needed for rule creation from the response.

      Key response field: taskClassificationIdNo (classification ID)


      > Prerequisite API: /api/app-api/sip/platform/v2/review/getRulesByClassificationIdNo

      Purpose: Used as a prerequisite when updating rules to get the classification ID information of the rule.

      Key response field: classificationIdNoList (list of classification IDs configured for the current rule)
    operationId: listModelFieldInfoByClassificationIdNoList
    parameters:
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/reviews.yaml#/ApiClassificationIdNoListReqVO'
      required: true
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultListApiModelFieldRespVO'
/api/app-api/sip/platform/v2/review/create:
  post:
    tags:
      - File Review
    summary: Create Review Rule
    description: >-
      Create a review rule. Some prerequisite APIs need to be called before invoking this API.


      >
      Prerequisite API: /api/app-api/sip/platform/v2/review/listExecuteTasksByFileBatchNo

      Purpose: Get all classification IDs under the batch.

      Key response field: taskClassificationIdNo (classification ID)


      >
      Prerequisite API: /api/app-api/sip/platform/v2/review/listModelFieldInfoByClassificationIdNoList

      Purpose: Get field information under the classifications.

      Key response fields: id (equivalent to fieldId), fieldName, blockType (distinguishes basic fields from table fields), classificationIdNo (indicates which classification the field belongs to),
      tableIdNo (table ID, if the field is a table field), tableName (table name, if the field is a table field)
    operationId: createReviewRule
    parameters:
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/reviews.yaml#/ApiRuleReviewCreateReqVO'
      required: true
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultApiRuleReviewCreateRespVO'
/api/app-api/sip/platform/v2/review/update:
  post:
    tags:
      - File Review
    summary: Update Review Rule
    description: >-
      Update a review rule. Some prerequisite APIs need to be called before invoking this API.


      >
      Prerequisite API: /api/app-api/sip/platform/v2/review/listModelFieldInfoByClassificationIdNoList

      Purpose: Get field information under the classifications.

      Key response fields: id (equivalent to fieldId), fieldName, blockType (distinguishes basic fields from table fields), classificationIdNo (indicates which classification the field belongs to),
      tableIdNo (table ID, if the field is a table field), tableName (table name, if the field is a table field)


      > Prerequisite API: /api/app-api/sip/platform/v2/review/getRulesByClassificationIdNo

      Purpose: Get all review rules under the current batch by workspaceIdNo and fileBatchNo.

      Key response fields: classificationIdNoList (list of classification IDs configured for the current rule), fieldInfoList (list of field information configured for the current rule), reviewRuleIdNo (review rule ID)
    operationId: updateReviewRule
    parameters:
      - name: x-ti-app-id
        in: header
        required: true
        schema:
          type: string
          description: x-ti-app-id
          example: 1234abcd
      - name: x-ti-secret-code
        in: header
        required: true
        schema:
          type: string
          description: x-ti-secret-code
          example: 1234abcd
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/reviews.yaml#/ApiRuleReviewUpdateReqVO'
      required: true
    responses:
      '200':
        description: OK
        content:
          '*/*':
            schema:
              $ref: '../components/schemas/reviews.yaml#/CommonResultApiRuleReviewUpdateRespVO'
